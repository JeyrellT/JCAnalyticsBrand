            {
              "@type": "Question",
              "name": "¿Cuánto cuesta un proyecto con JC Analytics?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Los proyectos arrancan desde US$30 (una automatización puntual de Excel) y suben según dificultad: generación de documentos desde US$40, tesis y proyectos de análisis desde US$50, Alteryx/KNIME desde US$65, Power Platform desde US$85, dashboards Power BI desde US$125, páginas web con reservas desde US$900 y software a la medida a partir de US$2.000 (tope US$6.000). Podés estimar tu rango en el cotizador del sitio; la cifra final se cierra en una primera sesión sin costo."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué significa \"de procesos dependientes a sistemas que funcionan\"?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Es nuestra promesa de marca: tomamos procesos que hoy dependen de una persona, un Excel o una rutina manual y los convertimos en sistemas que se ejecutan solos, con validaciones y evidencia medible de que funcionan. El primer diagnóstico es sin costo y el avance se muestra cada 72 horas, no al final."
              }
            },
            {
              "@type": "Question",
              "name": "¿Automatizan la factura electrónica v4.4 y los rechazos de Hacienda?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sí. Validamos los comprobantes contra el esquema v4.4 y conciliamos las respuestas de Hacienda para detectar los rechazos el mismo día, no a fin de mes."
              }
            },
            {
              "@type": "Question",
              "name": "¿Pueden automatizar la planilla y el cálculo de la CCSS?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sí. Automatizamos el cierre de planilla y el cálculo de deducciones de CCSS, con validaciones que detectan inconsistencias y el archivo listo para pago y para el SICERE."
              }
            },
            {
              "@type": "Question",
              "name": "¿Hacen páginas web con backend y gestión del negocio?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sí. Diseñamos la experiencia pública con la identidad de tu marca y desarrollamos el backend y los paneles que necesita tu operación. Inventarios, reservas, pedidos, control de procesos, roles e integraciones se definen según cada proyecto. El portafolio incluye sitios de clientes como Soporte 2.0, Rafael Inclusive y SIL Global, además de productos propios y demos abiertos."
              }
            },
            {
              "@type": "Question",
              "name": "¿Cuánto cuesta una web o plataforma a medida?",
