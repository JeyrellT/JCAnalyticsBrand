name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jcanalytics-app/package-lock.json

      - name: Install dependencies
        working-directory: jcanalytics-app
        run: npm ci

      - name: Lint
        working-directory: jcanalytics-app
        run: npm run lint

      - name: Build all localized pages
        working-directory: jcanalytics-app
        run: npm run build

      - name: Verify bilingual pages and contact flows
        working-directory: jcanalytics-app
        run: npm run check:site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: jcanalytics-app/dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Mientras la fuente de Pages siga en "Deploy from a branch", GitHub lanza
      # en paralelo su propio "pages build and deployment" (publica la raíz de
      # main, sin index.html). El último en terminar gana: si es el automático,
      # el sitio puede quedar en 404. Se conserva la espera heredada como mitigación,
      # hasta confirmar Settings → Pages → Source: GitHub Actions.
      - name: Esperar a que termine el deploy automático de rama
        run: sleep 150

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
