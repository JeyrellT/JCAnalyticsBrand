name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jcanalytics-app/package-lock.json

      - name: Install dependencies
        working-directory: jcanalytics-app
        run: npm ci
        env:
          # No descargar Chromium aquí: que un fallo de descarga NUNCA rompa el deploy.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build
        working-directory: jcanalytics-app
        run: npm run build

      - name: Prerender (non-fatal — el HTML servido trae el contenido para bots/SEO)
        working-directory: jcanalytics-app
        run: |
          npx puppeteer browsers install chrome || true
          node scripts/prerender.mjs || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jcanalytics-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
