name: Portal del equipo

on:
  push:
    branches: [main]
    paths: ['portal/**', '.github/workflows/portal.yml']
  pull_request:
    branches: [main]
    paths: ['portal/**', '.github/workflows/portal.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: API, permissions and finance tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the in-browser demo (single file for mobile review)
        run: npm run build:demo

      - name: End-to-end in a real browser (desktop and mobile)
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: npm run e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-screenshots
          path: portal/test-results/
          if-no-files-found: ignore
          retention-days: 7
